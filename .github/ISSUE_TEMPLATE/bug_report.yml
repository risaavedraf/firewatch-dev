# FireWatch bug issue form.
#
# The issue-authoring flow (skill: issue-creation) treats this form as the single
# format authority: it collects the answers of these controls and materializes them
# as "### <label>" sections. `markdown` blocks are guidance only and are dropped
# from the materialized body, so every rule that must survive lives in a control
# (dropdown, textarea, checkboxes) and never in prose.
#
# Conventions: odd/PR-CONVENTIONS.md
name: Bug report
description: Report a FireWatch defect with enough evidence to reproduce it.
title: "[Bug]: "
labels:
  - "type:bug"
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed issues before writing. If this defect is already
        reported, comment there instead of opening a duplicate.

        Do not publish credentials, personal data, or internal paths.

        A maintainer applies `status:approved` after review; this issue does not
        carry it on creation. The implementing PR comes later and must link this
        issue.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of FireWatch shows the defect?
      options:
        - Frontend
        - API
        - Data or model
        - Deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Describe the defect. Name the zone, batch, or screen when it applies.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What you actually saw. Paste the visible error message or text when there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead. If you do not know yet, say "unknown" in one line.
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: The steps in order, and what appears at each one. If the defect is not consistent yet, say so.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: "Optional: logs, a screenshot, a request to the endpoint, or the version where you saw it."
    validations:
      required: false
  - type: checkboxes
    id: preflight
    attributes:
      label: Before opening this report
      options:
        - label: I searched open and closed issues and this defect is not already reported.
          required: true
        - label: I did not include credentials, personal data, or internal paths.
          required: true
        - label: I understand a maintainer applies `status:approved` after review; this issue ships without it.
          required: true
