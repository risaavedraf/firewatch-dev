# FireWatch feature request issue form.
#
# The issue-authoring flow (skill: issue-creation) treats this form as the single
# format authority: it collects the answers of these controls and materializes them
# as "### <label>" sections. `markdown` blocks are guidance only and are dropped
# from the materialized body, so every rule that must survive lives in a control
# (dropdown, textarea, checkboxes) and never in prose.
#
# Conventions: odd/PR-CONVENTIONS.md
name: Feature request
description: Propose a FireWatch capability or improvement and the problem it solves.
title: "[Feature]: "
labels:
  - "type:feature"
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed issues before writing. If this proposal is already
        discussed, comment there instead of opening a duplicate.

        Problem first, proposal second: a reviewer approves the case, not only the
        implementation.

        Do not publish credentials, personal data, or internal paths.

        A maintainer applies `status:approved` after review; this issue does not
        carry it on creation. The implementing PR comes later and must link this
        issue.
  - type: dropdown
    id: area
    attributes:
      label: Related area
      description: Where should the improvement live?
      options:
        - Frontend
        - API
        - Data or model
        - Deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is missing or painful today, and who does it affect? Describe the situation, not the fix.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should FireWatch do? If there is more than one option, describe the one you prefer.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        The observable outcomes that make this done. A maintainer scopes
        `status:approved` from these; say so if none yet.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Which other options did you evaluate, and why did you discard them? Say "none evaluated" if none.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Optional: links, usage examples, or any detail that helps evaluate the proposal."
    validations:
      required: false
  - type: checkboxes
    id: preflight
    attributes:
      label: Before opening this proposal
      options:
        - label: I searched open and closed issues and this proposal is not already discussed.
          required: true
        - label: I did not include credentials, personal data, or internal paths.
          required: true
        - label: I understand a maintainer applies `status:approved` after review; this issue ships without it.
          required: true
