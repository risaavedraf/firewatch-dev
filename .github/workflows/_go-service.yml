name: Go service checks
on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: backend/services/${{ inputs.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: backend/services/${{ inputs.service }}/go.sum
      - name: Format check (gofmt)
        run: test -z "$(gofmt -l .)"
      - name: Module integrity (go mod verify)
        run: go mod verify
      - name: Tests (go test -race)
        run: go test -race -count=1 ./...
      - name: Static checks (go vet)
        run: go vet ./...
      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Configure builder for SBOM and provenance attestations
        working-directory: backend
        run: |
          D=cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          IMG="moby/buildkit:buildx-stable-1@sha256:${D}"
          docker buildx create --name ci-attestations \
            --driver docker-container --driver-opt "image=$IMG" --use
      - name: Build container with provenance and SBOM
        working-directory: backend
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          docker buildx build --sbom=true --provenance=true --load \
            -f "services/$SERVICE/Dockerfile" -t "firewatch-$SERVICE:ci" .
      - name: Scan runtime image
        working-directory: backend
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
            aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "firewatch-$SERVICE:ci"
