name: Frontend
on:
  pull_request:
    paths:
      - 'frontend/**'
      # The frontend suite re-reads backend file:line citations: the permissions
      # matrix in src/views/SessionView.tsx is checked against the real guard
      # lines by tests/views/session.test.tsx. A backend edit can therefore fail
      # this job, and nothing else would catch it — PR #20 shifted three cited
      # lines and this job never ran for it, leaving main red. Issue #24.
      - 'backend/**'
      - '.github/workflows/**'
  push:
    # Same reason: the drift detector must run when the backend moves.
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      # The legacy page has no dependencies; the React migration has a lockfile.
      - name: Install dependencies when declared
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Lint, typecheck and build when declared
        run: |
          if [ -f package-lock.json ]; then
            npm run lint
            npm run typecheck
            npm run build:local
          fi
      - name: Run tests
        run: npm test
      - name: Loopback smoke
        run: npm run smoke
      # Proves the strict production path compiles. Runs last: the smoke
      # above still needs a bundle built with the localhost origins.
      - name: Production build with explicit origins
        env:
          VITE_GATEWAY_ORIGIN: https://firewatch.example.com
          VITE_ISSUER: https://auth.firewatch.example.com/realms/firewatch
          VITE_REDIRECT_URI: https://firewatch.example.com/
        run: |
          if [ -f package-lock.json ]; then
            npm run build
          fi
