name: Backend integration
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/**', '.gitattributes']
  push:
    paths: ['backend/**', '.github/workflows/**', '.gitattributes']
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/init_env.py
      - run: docker compose config --quiet
      - name: Migration readiness regression check
        run: python3 -m unittest discover -s scripts -p test_ci_migration.py -v
      - name: Verify migration readiness on a disposable project
        run: python3 scripts/verify_ci_migration.py
      - run: docker compose --profile test run --build --rm jobs-test
      - run: docker compose --profile test run --build --rm risk-test
      - run: docker compose --profile test run --build --rm prevention-test
      - run: docker compose up -d --build
      - run: python3 scripts/smoke.py --resilience
      - name: Validate deployment and HTTP contracts
        run: |
          kubectl kustomize deploy/k8s/base \
            | go run github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7 \
              -strict -summary
          go run github.com/getkin/kin-openapi/cmd/validate@v0.133.0 \
            contracts/openapi/firewatch-v1.yaml
      # A failed migrator is a dependency container of the run above, so Compose
      # reports only `service "..." didn't complete successfully: exit 1` and
      # never streams the migrator's own stderr. These commands print the reason
      # while the containers still exist; the teardown below removes them after.
      - name: Migration diagnostics on failure
        if: failure()
        run: |
          docker compose --profile test ps -a || true
          docker compose --profile test logs --no-color --tail 200 || true
      - name: Teardown ephemeral CI data
        if: always()
        run: docker compose --profile test down -v
