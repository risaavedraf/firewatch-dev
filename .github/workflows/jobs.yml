name: Jobs
on:
  pull_request:
    paths:
      - 'backend/services/jobs/**'
      - 'backend/contracts/**'
      - 'backend/go.work'
      - 'backend/go.work.sum'
      - 'backend/.dockerignore'
      - '.github/workflows/**'
  push:
    paths:
      - 'backend/services/jobs/**'
      - 'backend/contracts/**'
      - 'backend/go.work'
      - 'backend/go.work.sum'
      - 'backend/.dockerignore'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/_go-service.yml
    with: {service: jobs}
