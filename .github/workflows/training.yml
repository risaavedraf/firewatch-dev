name: Training panel
on:
  pull_request:
    paths:
      - 'backend/training/**'
      # The assembler reads the artifact descriptor as its only feature vocabulary, so
      # a renamed or reordered feature in the inference testdata must re-run this job.
      - 'backend/services/inference/testdata/**'
      - '.github/workflows/**'
  push:
    paths:
      - 'backend/training/**'
      - 'backend/services/inference/testdata/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/training
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/training/requirements-dev.txt
      - name: Install the pinned test and lint tools
        run: python -m pip install -r requirements-dev.txt
      # Nothing here trains a model: this package builds the comuna-day panel and the
      # tests run against the committed fixture. The suite blocks sockets itself (an
      # autouse fixture in tests/conftest.py), so a test that reached the network would
      # fail here even though the runner has one -- that is what keeps the job honest
      # about the sample never being a download.
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Tests (pytest, offline, fixture only)
        run: python -m pytest -q
      - name: Assemble the fixture panel end to end
        run: |
          python assemble.py --source tests/fixtures/conaf-maule-sample.csv --out out
          # The manifest is the part a reviewer checks: it has to say 84 comuna-days for
          # 44 events and declare six of the seven features unavailable.
          python - <<'PY'
          import json
          import pathlib
          manifest = json.loads(pathlib.Path("out/manifest.json").read_text(encoding="utf-8"))
          counts = manifest["counts"]
          assert counts["source_rows"] == 44, counts
          assert counts["comuna_days"] == 84, counts
          assert counts["comuna_days_with_fire"] == 30, counts
          assert counts["null_date_rows_dropped"] == 0, counts
          statuses = {f["name"]: f["status"] for f in manifest["features"]}
          assert statuses == {
              "temp_max": "unavailable",
              "temp_min": "unavailable",
              "humidity_rel": "source",
              "wind_speed": "unavailable",
              "wind_dir": "unavailable",
              "precip_sum": "unavailable",
              "radiation_sol": "unavailable",
          }, statuses
          print("manifest ok:", counts["comuna_days"], "comuna-days,", statuses)
          PY
