openapi: 3.0.3
info:
  title: FireWatch demonstration backend
  version: 0.1.0
  description: Own non-official rule over synthetic input; no real inference.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/risk/status:
    get:
      operationId: getRiskStatus
      description: >-
        Viewer/admin. Bounded database ping then cached broker snapshot. Not an
        end-to-end delivery test or evidence of real risk. Freshness is bounded,
        not instantaneous. A 403 means not authorized to check, not unavailable.
        This authenticated route's 200/503 follows the full dependency decision
        and keeps doing so; the unauthenticated /health/ready probe is decided
        by the database alone, so broker and dead-letter degradation is reported
        here and in /metrics instead of by that probe's status code.
      responses:
        '200': {$ref: '#/components/responses/OperationalReady'}
        '503': {$ref: '#/components/responses/OperationalUnavailable'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v1/jobs/status:
    get:
      operationId: getJobsStatus
      description: >-
        Admin only; viewer receives 403, meaning not authorized to check rather
        than unavailable. Bounded database ping then cached broker snapshot;
        not an instantaneous or end-to-end delivery guarantee. This
        authenticated route's 200/503 follows the full dependency decision and
        keeps doing so; the unauthenticated /health/ready probe is decided by
        the database alone, so broker and dead-letter degradation is reported
        here and in /metrics instead of by that probe's status code.
      responses:
        '200': {$ref: '#/components/responses/OperationalReady'}
        '503': {$ref: '#/components/responses/OperationalUnavailable'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v1/jobs:
    post:
      operationId: createDemoJob
      description: >-
        Admin only. Same subject and idempotency key return the existing job.
        Any zone code present in the zone catalogue is accepted; the fixed
        demo zone is one entry of that catalogue. Optional scenario_id selects
        a reproducible synthetic profile. Without it, the legacy fixture is
        used. A scenario job's evaluated_at is assigned by the server once,
        never accepted from the client. Idempotent retries return the original
        job, scenario and instant even if the new body requests another
        scenario.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [zone_id]
              properties:
                zone_id:
                  type: string
                  example: valparaiso-demo
                  description: >-
                    Valid values are the zone catalogue (zones); the accepted
                    set is served by the zones endpoint.
                scenario_id:
                  $ref: '#/components/schemas/SyntheticScenarioID'
      responses:
        '202':
          description: Durable job accepted or previously accepted job returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415':
          description: JSON content type required.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
  /v1/jobs/{id}:
    get:
      operationId: getJob
      description: >-
        Admin only. queued means no answer has been received yet and stays so
        until one arrives; published is completed. failed is terminal and is
        recorded only from real evidence - a permanent consumer failure or an
        exhausted retry budget - with its failure_reason and the attempts spent,
        never from a clock.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
  /v1/jobs/{id}/replay:
    post:
      operationId: replayJob
      description: >-
        Admin only. Returns a failed job to queued, or re-dispatches a queued
        one, so its work is dispatched again; nothing is replayed automatically.
        The transition is one guarded update, so two concurrent replays cannot
        both enqueue - the loser is answered 409 rather than silently accepted.
        A failed job is replayed by its state alone: failure_reason and
        failed_at are cleared and attempts returns to 0. A queued job may still
        be in flight, so re-dispatching it requires the optional confirmation in
        the request body; without it the request is answered 409
        replay_confirmation_required and nothing is written. A published job is
        never replayable, with or without the confirmation. The row, its audit
        record and a new jobs.requested.v1 event are written in one transaction,
        exactly as job creation does, and requested_at is deliberately NOT
        rewritten: it is the instant the observation was requested, so a
        replayed job older than the freshness window produces a batch that is
        already stale. Duplicate effects are prevented downstream by the unique
        inbox that already exists - and, for a re-dispatch whose batch already
        exists, by the completion re-emitted for that stored batch -, not by
        this call. The body is the same Job object as GET /v1/jobs/{id}.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: false
        description: >-
          Optional, and only meaningful for a queued job. A malformed body is
          refused for either state; a failed job is replayed whether or not the
          confirmation is sent.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                confirm:
                  type: string
                  enum: [queued_may_be_in_flight]
                  description: >-
                    The operator's explicit acceptance that a queued job may
                    still be running, so the same work may be dispatched twice;
                    this value is the only accepted one.
      responses:
        '202':
          description: >-
            A failed job was returned to queued with its terminal fields
            cleared and attempts at 0, or a queued job was re-dispatched; the
            body is the resulting job.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '400':
          description: >-
            Rejected before any effect: the id is not a uuid, or the body is not
            exactly the documented confirmation.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [code, request_id]
                properties:
                  code:
                    type: string
                    enum: [invalid_job_id, invalid_replay_request]
                  request_id: {type: string, format: uuid}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Unknown job id; code is job_not_found.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [code, request_id]
                properties:
                  code: {type: string, enum: [job_not_found]}
                  request_id: {type: string, format: uuid}
        '409':
          description: >-
            The job exists but its state forbids this replay, or the replay lost
            the race to a concurrent one. code is replay_confirmation_required
            when the job is queued and the body did not confirm the re-dispatch,
            and job_not_replayable when the job is published and already has its
            outcome.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [code, request_id]
                properties:
                  code:
                    type: string
                    enum: [replay_confirmation_required, job_not_replayable]
                  request_id: {type: string, format: uuid}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
  /v1/risk/latest:
    get:
      operationId: getLatestBatch
      description: >-
        Viewer/admin. Reads the newest requested batch, not the most recently
        finished worker.
      parameters: [{$ref: '#/components/parameters/Zone'}]
      responses:
        '200':
          description: Latest batch, with current/stale status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: >-
            No published batch for the zone; the caller has insufficient data.
            This is an empty-state answer rather than a failure, so it carries
            code and data_status and, unlike the shared error body, no
            request_id.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema:
                type: object
                required: [code, data_status]
                properties:
                  code: {type: string, enum: [no_published_batch]}
                  data_status: {type: string, enum: [insufficient]}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
  /v1/risk/history:
    get:
      operationId: listBatches
      description: >-
        Viewer/admin. Up to 100 batches in descending request-time order.
      parameters: [{$ref: '#/components/parameters/Zone'}]
      responses:
        '200':
          description: Bounded history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Batch'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
  /v1/risk/synthetic-scenarios:
    get:
      operationId: listSyntheticScenarios
      description: >-
        Viewer/admin. Lists the built-in demonstration profiles without
        fetching observations or accessing the database/broker. These are
        synthetic software scenarios, not calibrated risk probabilities or
        official observations. The partial-retrieval profile intentionally
        refuses publication; existing job state handling still applies.
      responses:
        '200':
          description: Ordered synthetic scenario catalogue
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SyntheticScenario'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v1/risk/sources:
    get:
      operationId: getRiskSources
      description: >-
        Viewer/admin. Embedded geographic provenance and the active publisher
        provider descriptor, separately. No database, broker or source fetch.
        Geography does not establish real risk observations, a licence grant or
        DIFROL validation. Stored cutoff_at is a retrieval-time substitution,
        not an actual source cutoff; source_cutoff_at is explicitly null.
      responses:
        '200':
          description: Geography integrity and active risk input
          content:
            application/json:
              schema:
                type: object
                required: [geography, risk_input, sources]
                properties:
                  geography:
                    type: object
                    required:
                      - provenance
                      - source_cutoff_at
                      - cutoff_semantics
                      - integrity
                    properties:
                      provenance:
                        $ref: '#/components/schemas/GeographyProvenance'
                      source_cutoff_at:
                        type: string
                        nullable: true
                        description: Null; actual source cutoff is unknown.
                      cutoff_semantics:
                        type: string
                        description: >-
                          Stored cutoff_at equals retrieved_at,
                          not source cutoff.
                      integrity:
                        type: object
                        required:
                          - algorithm
                          - recorded_sha256
                          - computed_sha256
                          - matches
                        properties:
                          algorithm: {type: string, enum: [sha256]}
                          recorded_sha256:
                            type: string
                            pattern: '^[0-9a-f]{64}$'
                          computed_sha256:
                            type: string
                            pattern: '^[0-9a-f]{64}$'
                          matches: {type: boolean, enum: [true]}
                  risk_input:
                    type: object
                    required:
                      - id
                      - display_name
                      - kind
                      - origin
                      - endpoint
                      - license
                      - attribution
                      - variables
                      - geo_coverage
                      - temporal_coverage
                      - cadence
                      - purpose
                      - priority
                      - synthetic
                    properties:
                      id: {type: string}
                      display_name: {type: string}
                      kind: {type: string}
                      origin: {type: string}
                      endpoint: {type: string}
                      license: {type: string}
                      attribution: {type: string}
                      variables: {type: array, items: {type: string}}
                      geo_coverage: {type: string}
                      temporal_coverage: {type: string}
                      cadence: {type: string}
                      purpose: {type: string}
                      priority: {type: integer}
                      synthetic: {type: boolean}
                  sources:
                    type: array
                    description: >-
                      Per-source cycle state and freshness. Empty when no
                      scheduler is configured; never null.
                    items: {$ref: '#/components/schemas/CycleSourceStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: >-
            The embedded geography artifact failed its integrity check, or no
            active publisher descriptor is available. code is
            geography_integrity_unavailable or risk_source_unavailable.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v1/risk/cycle/run:
    post:
      operationId: runRiskCycle
      description: >-
        Admin. Runs one ingestion cycle synchronously for the demo: ingest,
        per-record validation, classification and publication for every
        configured zone. The result reports each zone and whether the cycle was
        complete. A zone that fails does not abort the rest, and an incomplete
        cycle publishes nothing invalid. With no scheduler configured the route
        answers 503 cycle_unavailable.
      responses:
        '200':
          description: Outcome of the cycle that just ran.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CycleRunResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: >-
            No cycle scheduler is configured. code is cycle_unavailable.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v1/models:
    get:
      operationId: listModels
      description: >-
        Viewer/admin. The model registry: every version with its kind, frozen
        parameter fingerprint, approval instant, metrics and active flag. The
        active row is first so the UI can show the version that judges new
        assessments. Reading the registry promotes nothing.
      responses:
        '200':
          description: Model registry ordered active first, then by version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v1/models/{version}/activate:
    post:
      operationId: activateModelVersion
      description: >-
        Admin. Makes one model version active and records its approval in one
        transaction: the previously active row is cleared, approved_at is set
        when it was null, and metrics records the activation. At most one
        version is active. Reversion is activating the previous version through
        this same route. A placeholder is refused with 409 because the schema
        forbids it from ever being active, and nothing is written.
      parameters:
        - in: path
          name: version
          required: true
          schema: {type: string}
          description: Model version identifier, e.g. firewatch-rule-v2.
      responses:
        '200':
          description: The activated version with its new lifecycle state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelVersion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: >-
            No model version has that identifier. code is model_not_found.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: >-
            The version exists but may never be active (a placeholder). code is
            model_not_activatable. Nothing is written.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v1/risk/zones:
    get:
      operationId: listZones
      description: >-
        Viewer/admin. The zone catalogue as a GeoJSON FeatureCollection
        following RFC 7946. Zones without geometry are omitted rather than
        given an invented one, so an empty collection is a valid answer and
        never an error.
      parameters:
        - in: query
          name: bbox
          required: false
          schema: {type: string}
          description: >-
            Optional bounding box as exactly four comma-separated WGS84
            numbers: minLon,minLat,maxLon,maxLat. Only zones whose geometry
            intersects it are returned. A malformed or repeated value is
            rejected with 400.
      responses:
        '200':
          description: >-
            Zone catalogue as a FeatureCollection. It is empty when no zone
            matches the bbox, or when no catalogue zone carries a geometry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoneFeatureCollection'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v1/audit:
    get:
      operationId: listAudit
      description: >-
        Admin only. Last 100 audit records; application role cannot update or
        delete audit rows.
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [actor_id, action, job_id, trace_id, occurred_at]
                  properties:
                    actor_id: {type: string}
                    action:
                      type: string
                      enum: [job.requested, batch.published]
                    job_id: {type: string, format: uuid}
                    trace_id: {type: string, format: uuid}
                    occurred_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
  /v1/prevention/actions:
    get:
      operationId: listPreventiveActions
      description: >-
        Viewer/admin. Lists preventive actions, newest first, capped at 200
        rows. Both query parameters are optional filters: an omitted one
        narrows nothing, and an empty result is a valid answer rather than an
        error. A parameter that is repeated, is not one of these two, or carries
        a status outside the frozen vocabulary is refused 422 invalid_query
        before anything is read, because an unrecognised status would otherwise
        read as "no such actions" instead of "no such state".
      parameters:
        - in: query
          name: community_code
          required: false
          schema:
            type: string
            description: >-
              Community the action belongs to. The accepted set is whatever the
              stored actions hold, so it is deliberately not an enum here: an
              enum would drift from the data.
        - in: query
          name: status
          required: false
          schema: {$ref: '#/components/schemas/PreventiveActionState'}
      responses:
        '200':
          description: Actions matching the filters; [] when none matches.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PreventiveAction'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: Invalid input; nothing was read.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [code, request_id]
                properties:
                  code: {type: string, enum: [invalid_query]}
                  request_id: {type: string, format: uuid}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
    post:
      operationId: createPreventiveAction
      description: >-
        Admin only; a viewer is refused 403. The action is created in the
        propuesta state and its id is server-generated: neither status nor id is
        accepted from the client, and an unknown field is refused rather than
        ignored. Only community_code and title are required, because the
        contract names the other columns without defining a vocabulary for
        them.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreventiveActionCreate'}
      responses:
        '201':
          description: Action created in the propuesta state.
          headers:
            Location:
              description: Resource path of the created action.
              schema: {type: string}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreventiveAction'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415':
          description: JSON content type required.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [code, request_id]
                properties:
                  code: {type: string, enum: [json_required]}
                  request_id: {type: string, format: uuid}
        '422':
          description: >-
            Invalid input; no action was created. A blank community or title, a
            due_date that is not a calendar date, an unknown field, or a body
            that is not one JSON document is refused here.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [code, request_id]
                properties:
                  code: {type: string, enum: [invalid_action_request]}
                  request_id: {type: string, format: uuid}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
  /v1/prevention/actions/{id}:
    get:
      operationId: getPreventiveAction
      description: >-
        Viewer/admin. The action plus its attributable history, oldest first.
        The history holds one row per accepted transition; creation is not a
        transition, so a newly created action has an empty history.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Action with its history
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreventiveActionDetail'}
        '400':
          description: The path id is not a UUID.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [code, request_id]
                properties:
                  code: {type: string, enum: [invalid_action_id]}
                  request_id: {type: string, format: uuid}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No action holds this id.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [code, request_id]
                properties:
                  code: {type: string, enum: [action_not_found]}
                  request_id: {type: string, format: uuid}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
  /v1/prevention/actions/{id}/transitions:
    post:
      operationId: transitionPreventiveAction
      description: >-
        Admin only; a viewer is refused 403. Advances one action to the
        requested state and appends one history row in a single transaction
        that locks the row, so two concurrent transitions cannot both be
        accepted. The two refusals differ: a target outside the frozen
        vocabulary is invalid input (422 invalid_transition_request) and never
        reaches storage, while a target that is a state but is not reachable
        from the action's current status is a conflict (409
        invalid_transition) that leaves the action exactly as it was and writes
        no history row. Sending the status the action already holds is not a
        transition and is refused the same way.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreventiveActionTransition'}
      responses:
        '200':
          description: The new version after the accepted transition.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreventiveAction'}
        '400':
          description: The path id is not a UUID.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [code, request_id]
                properties:
                  code: {type: string, enum: [invalid_action_id]}
                  request_id: {type: string, format: uuid}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No action holds this id.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [code, request_id]
                properties:
                  code: {type: string, enum: [action_not_found]}
                  request_id: {type: string, format: uuid}
        '409':
          description: >-
            The action exists but the frozen state machine does not allow this
            move from its current status. Nothing is written: the status,
            updated_at and the history are unchanged.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [code, request_id]
                properties:
                  code: {type: string, enum: [invalid_transition]}
                  request_id: {type: string, format: uuid}
        '415':
          description: JSON content type required.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [code, request_id]
                properties:
                  code: {type: string, enum: [json_required]}
                  request_id: {type: string, format: uuid}
        '422':
          description: >-
            Invalid input; the transition was not attempted. A missing or
            unknown to, an unknown field, or a body that is not one JSON
            document is refused here rather than reaching storage.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [code, request_id]
                properties:
                  code: {type: string, enum: [invalid_transition_request]}
                  request_id: {type: string, format: uuid}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {$ref: '#/components/responses/UpstreamUnavailable'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Zone:
      in: query
      name: zone_id
      required: true
      schema:
        type: string
        example: valparaiso-demo
        description: >-
          Catalogue zone code. The valid set is the zone catalogue, served by
          the zones endpoint. It is deliberately not an enum: an enum here
          would drift from the table.
  headers:
    RequestID:
      description: >-
        Canonical lower-case dashed UUID minted by the gateway, returned on
        every response and repeated as request_id in the JSON error body. For
        the configured browser origin it is also named in
        Access-Control-Expose-Headers so page JavaScript can read it.
      schema: {type: string, format: uuid}
  responses:
    OperationalReady:
      description: Dependencies ready, not pipeline delivery assurance
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OperationalStatus'}
    OperationalUnavailable:
      description: Dependencies degraded or unknown
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OperationalStatus'}
    BadRequest:
      description: Invalid input; the request was rejected before any effect.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: Missing, malformed or unverifiable access token.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: Token verified but its role is not permitted for this route.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: The addressed resource does not exist.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: >-
        Gateway quota exhausted; the request is answered before routing. Three
        layers answer this status: an aggregate bound charged before
        authentication, a bound charged per verified token subject, and one
        deliberately shared bound charged for unauthenticated requests. Identity
        is the verified token subject only, never a forwarded address. The
        response shape is identical for all three layers, so this status applies
        to every operation in this document.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Retry-After:
          description: Seconds the caller should wait before retrying.
          schema: {type: string, example: '1'}
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    UpstreamUnavailable:
      description: >-
        Gateway could not reach the upstream service that owns the route
        (connection failure or response-header timeout); no upstream response
        was observed.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    StorageUnavailable:
      description: >-
        The dependency the operation reads or writes was unavailable; the
        operation has no effect and stored state is unchanged.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Cache-Control: {schema: {type: string, enum: [no-store]}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    CycleSourceStatus:
      type: object
      required: [source_id, complete]
      properties:
        source_id: {type: string}
        last_run_at: {type: string, format: date-time, nullable: true}
        next_run_at: {type: string, format: date-time, nullable: true}
        complete: {type: boolean}
        age_seconds: {type: number, nullable: true, minimum: 0}
        last_error: {type: string}
      description: >-
        Freshness and state of one source. last_run_at, next_run_at and
        age_seconds are null when the source has never run and complete is
        false. age_seconds is the age of the last attempt, so a value above the
        15 minute target is the stale signal.
    CycleZoneResult:
      type: object
      required: [zone_id, published]
      properties:
        zone_id: {type: string}
        published: {type: boolean}
        error: {type: string}
    CycleRunResult:
      type: object
      required: [source_id, started_at, finished_at, complete, zones]
      properties:
        source_id: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        complete: {type: boolean}
        zones:
          type: array
          items: {$ref: '#/components/schemas/CycleZoneResult'}
      description: >-
        One cycle outcome. complete is false when any zone failed; a failed zone
        does not abort the rest.
    ModelVersion:
      type: object
      required: [version, kind, params_hash, approved_at, metrics, active]
      properties:
        version: {type: string}
        kind: {type: string, enum: [rule, trained, placeholder]}
        params_hash: {type: string, nullable: true, pattern: '^[0-9a-f]{64}$'}
        approved_at: {type: string, format: date-time, nullable: true}
        metrics: {type: object, additionalProperties: true}
        active: {type: boolean}
      description: >-
        One registry row. params_hash is the fingerprint of the effective
        parameters, not a model artifact digest, and is null for a placeholder
        whose parameter set is not reconstructible.
    ModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: {$ref: '#/components/schemas/ModelVersion'}
    ErrorResponse:
      type: object
      description: >-
        One error body shared by the gateway and both backend services. It
        carries a stable machine-readable code and the request's correlation id,
        which is also returned in the X-Request-ID header.
      required: [code, request_id]
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable error code, not a free-form message. The
            responses that distinguish route-specific failures enumerate the
            codes they answer. The shared error responses are reused by many
            operations, so they describe the status and headers instead and
            leave the code to the layer that decided the failure.
        request_id:
          type: string
          format: uuid
          description: Correlation id, identical to the X-Request-ID header.
    OperationalStatus:
      type: object
      required: [checked_at, ready, reason, dependencies]
      properties:
        checked_at:
          type: string
          format: date-time
          description: UTC evaluation completion
        ready: {type: boolean}
        reason:
          type: string
          enum:
            - ''
            - database_unavailable
            - broker_unavailable
            - dead_letter_depth_unknown
            - dead_letter_backlog
            - status_unavailable
          description: >-
            Database failure precedes broker failure, unknown depth, then
            backlog; empty on success.
        dependencies:
          $ref: '#/components/schemas/OperationalDependencies'
    OperationalDependencies:
      type: object
      required: [database, broker, dead_letter]
      properties:
        database: {$ref: '#/components/schemas/OperationalDependency'}
        broker: {$ref: '#/components/schemas/OperationalDependency'}
        dead_letter: {$ref: '#/components/schemas/DeadLetterStatus'}
    OperationalDependency:
      type: object
      required: [state]
      properties:
        state: {type: string, enum: [ready, degraded, unknown]}
    DeadLetterStatus:
      type: object
      required:
        [state, depth, sampled_at, age_seconds, max_age_seconds, max_depth]
      properties:
        state: {type: string, enum: [ready, degraded, unknown]}
        depth: {type: integer, format: int64, nullable: true, minimum: 0}
        sampled_at: {type: string, format: date-time, nullable: true}
        age_seconds: {type: number, nullable: true, minimum: 0}
        max_age_seconds: {type: number, nullable: true, minimum: 0}
        max_depth: {type: integer, format: int64, nullable: true, minimum: 0}
      description: >-
        Broker connectivity is independent from sample freshness. Missing or
        stale depth is null/unknown; meaningful timestamp and age remain.
        Future or absent timestamps yield null sample and age. Age greater than
        max_age_seconds is stale; equality is fresh. Depth exceeding max_depth
        is degraded; equality is ready. Configured thresholds are nonnull;
        absent evaluator gives null thresholds and unknown dependencies.
    GeographyProvenance:
      type: object
      description: >-
        Original embedded artifact fields; verbatim attribution and restriction.
        This metadata does not establish a licence grant or DIFROL validation.
        Unknown future fields remain compatible.
      additionalProperties: true
      required:
        - source_id
        - provider
        - endpoint
        - query_sha256
        - requested_srid
        - source_wkid
        - source_format
        - derived_format
        - retrieved_at
        - cutoff_at
        - record_count
        - expected_record_count
        - record_count_matches_expected
        - complete
        - exceeded_transfer_limit
        - raw_path
        - raw_sha256
        - derived_path
        - derived_sha256
        - attribution
        - restriction
        - restriction_source
        - notes
      properties:
        source_id: {type: string}
        provider: {type: string}
        endpoint: {type: string, format: uri}
        query_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        requested_srid: {type: integer, minimum: 0}
        source_wkid: {type: integer, minimum: 0}
        source_format: {type: string}
        derived_format: {type: string}
        retrieved_at: {type: string, format: date-time}
        cutoff_at:
          type: string
          format: date-time
          description: >-
            Stored retrieval-time substitution equal to retrieved_at, not an
            actual source cutoff. Geography source_cutoff_at remains null.
        record_count: {type: integer, minimum: 0}
        expected_record_count: {type: integer, minimum: 0}
        record_count_matches_expected: {type: boolean}
        complete: {type: boolean}
        exceeded_transfer_limit: {type: boolean}
        raw_path: {type: string}
        raw_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        derived_path: {type: string}
        derived_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        attribution: {type: string}
        restriction: {type: string}
        restriction_source:
          type: string
          description: >-
            Verbatim service metadata citation containing a URL, not a bare URI.
        notes: {type: string}
    SyntheticScenarioID:
      type: string
      enum: [mild, mixed, dry-windy, missing-humidity, stale, partial-retrieval]
      description: >-
        Exact built-in synthetic profile ID. Optional in job requests;
        omit it to preserve the legacy fixture. These IDs describe test
        inputs, not observed conditions or scientific ground truth.
    SyntheticScenario:
      type: object
      required: [id, description]
      properties:
        id: {$ref: '#/components/schemas/SyntheticScenarioID'}
        description: {type: string}
    Job:
      type: object
      required: [id, zone_id, state, requested_at, attempts]
      properties:
        id: {type: string, format: uuid}
        zone_id:
          type: string
          example: valparaiso-demo
          description: >-
            Valid values are the zone catalogue (zones); the accepted set is
            served by the zones endpoint.
        state: {type: string, enum: [queued, published, failed]}
        batch_id: {type: string, format: uuid, nullable: true}
        requested_at: {type: string, format: date-time}
        attempts:
          type: integer
          minimum: 0
          description: >-
            Delivery attempts this consumer spent before the job reached a
            terminal outcome; 0 while queued or published. Recorded durably on
            the row as terminal evidence, so it is still readable after a
            consumer restart. An interrupted retry budget is NOT resumed from
            this value: each delivery starts its own count.
        failure_reason:
          type: string
          nullable: true
          description: >-
            Stable machine-readable code recorded only when state is failed:
            permanent_error (the handler can never succeed) or
            retries_exhausted (the bounded retry budget was spent). Null
            otherwise. The raw error is not stored here.
        failed_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Server instant the terminal failed state was recorded; null unless
            state is failed. It is evidence, not a deadline: a job with no
            answer stays queued and is never failed by the passing of time.
        scenario_id:
          type: string
          nullable: true
          description: >-
            Original selected synthetic profile; null or absent for legacy
            jobs. Never changed by idempotent retries.
        evaluated_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Server-assigned synthetic evaluation instant, fixed once per
            scenario job; null or absent for legacy jobs. Not an observation
            cutoff, actual source freshness, or forecast horizon.
    Batch:
      type: object
      required:
        - id
        - job_id
        - zone_id
        - requested_at
        - published_at
        - valid_until
        - model_version
        - demo
        - geometry
        - data_status
        - risk_level
        - notice
        - factors
        - rationale
        - policy
      properties:
        id: {type: string, format: uuid}
        job_id: {type: string, format: uuid}
        zone_id:
          type: string
          example: valparaiso-demo
          description: >-
            Valid values are the zone catalogue (zones); the accepted set is
            served by the zones endpoint.
        requested_at: {type: string, format: date-time}
        published_at: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        scenario_id:
          type: string
          nullable: true
          description: >-
            Synthetic profile selected for the originating job. Historical
            and legacy batches retain null or absent metadata without backfill.
        evaluated_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Synthetic evaluation instant preserved from the job. Not an
            observation cutoff or real-data freshness measurement.
        model_version:
          type: string
          example: academic-rule-v1
          description: >-
            Classifier version actually used for this batch, registered in the
            models table; rows written before the classifier existed carry
            demo-fixture-v1.
        demo:
          type: boolean
          description: >-
            Derived from the provenance of the provider that contributed the
            data; true means synthetic or demonstrative input.
        geometry:
          allOf:
            - $ref: '#/components/schemas/Geometry'
          description: >-
            Current catalogue territory for the commune, not an observed
            location or a frozen historical boundary. The legacy
            valparaiso-demo point is illustrative only. Missing commune
            geometry is an error, never a fallback to the demo point.
        data_status: {type: string, enum: [current, stale]}
        risk_level: {type: string, enum: [bajo, medio, alto, desconocido]}
        notice: {type: string}
        factors:
          type: array
          description: >-
            One entry per canonical variable, including the variables that are
            absent from the input.
          items:
            type: object
            required: [name, known]
            properties:
              name: {type: string}
              known: {type: boolean}
              value: {type: number}
              contribution: {type: number}
              note: {type: string}
        rationale:
          type: string
          description: >-
            Human-readable justification of the assessment, which declares the
            rule as our own non-official rule.
        policy:
          type: object
          nullable: true
          description: >-
            Effective policy reference recorded so a stored level can be
            reproduced; null for rows written before policy persistence existed.
          required: [policy_id, parameters, params_hash]
          properties:
            policy_id: {type: string}
            parameters:
              type: object
              additionalProperties: {type: string}
            params_hash: {type: string}
    Geometry:
      type: object
      description: >-
        A GeoJSON geometry following RFC 7946. The type member is the
        discriminator, and coordinates are the ones RFC 7946 defines for that
        type, so this schema deliberately does not restate them: duplicating
        the standard here would drift from it.
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point, Polygon, MultiPolygon]
        coordinates:
          description: >-
            RFC 7946 coordinates for the declared type: a single position for
            Point, an array of linear rings for Polygon, and an array of
            polygons for MultiPolygon. Each position is [longitude, latitude]
            in WGS84 degrees.
    ZoneProperties:
      type: object
      required: [code, name, province, kind]
      properties:
        code: {type: string, example: '05101'}
        name: {type: string, example: Valparaiso}
        province: {type: string, example: Valparaiso}
        kind: {type: string, enum: [comuna, demo]}
    ZoneFeature:
      type: object
      required: [type, properties, geometry]
      properties:
        type: {type: string, enum: [Feature]}
        properties: {$ref: '#/components/schemas/ZoneProperties'}
        geometry: {$ref: '#/components/schemas/Geometry'}
    ZoneFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: {type: string, enum: [FeatureCollection]}
        features:
          type: array
          description: >-
            One feature per catalogue zone that carries a geometry; empty when
            none matches, which is a valid answer rather than an error.
          items: {$ref: '#/components/schemas/ZoneFeature'}
    PreventiveActionState:
      type: string
      description: >-
        The frozen state vocabulary. The allowed moves are
        propuesta -> asignada, asignada -> en_curso, en_curso -> bloqueada,
        bloqueada -> en_curso, en_curso -> enviada, enviada -> aceptada,
        enviada -> devuelta and devuelta -> en_curso (reopening); cancelada is
        reachable from every non-terminal state. aceptada and cancelada are
        terminal. Every other move is 409 invalid_transition and writes
        nothing, including re-sending the state the action already holds.
      enum:
        - propuesta
        - asignada
        - en_curso
        - bloqueada
        - enviada
        - aceptada
        - devuelta
        - cancelada
    PreventiveAction:
      type: object
      required:
        - id
        - community_code
        - title
        - description
        - priority
        - status
        - assignee
        - due_date
        - created_by
        - created_at
        - updated_at
      properties:
        id: {type: string, format: uuid}
        community_code: {type: string}
        title: {type: string}
        description: {type: string}
        priority:
          type: string
          description: >-
            Free text. The contract names this column and defines no vocabulary
            for it, so it is deliberately not an enum; the empty string means
            the priority was not stated.
        status: {$ref: '#/components/schemas/PreventiveActionState'}
        assignee:
          type: string
          nullable: true
          description: Absent until someone is assigned; null means unassigned.
        due_date:
          type: string
          nullable: true
          description: >-
            Calendar date (YYYY-MM-DD), not an instant: a time of day would be
            a fabricated precision. Null when unset.
        created_by:
          type: string
          description: >-
            Verified token subject of the operator who created the action,
            never a client-supplied identity.
        created_at: {type: string, format: date-time}
        updated_at:
          type: string
          format: date-time
          description: >-
            Set by the accepted transition that last changed the action.
    PreventiveActionHistory:
      type: object
      description: >-
        One accepted transition, append-only: there is no update and no delete,
        which is what makes it the durable audit record of this service.
      required:
        - id
        - action_id
        - from_status
        - to_status
        - actor_sub
        - note
        - created_at
      properties:
        id: {type: integer, format: int64}
        action_id: {type: string, format: uuid}
        from_status: {$ref: '#/components/schemas/PreventiveActionState'}
        to_status: {$ref: '#/components/schemas/PreventiveActionState'}
        actor_sub:
          type: string
          description: Verified token subject of the operator who asked for it.
        note:
          type: string
          description: Free-text reason; the empty string means none was given.
        created_at: {type: string, format: date-time}
    PreventiveActionDetail:
      allOf:
        - $ref: '#/components/schemas/PreventiveAction'
        - type: object
          required: [history]
          properties:
            history:
              type: array
              description: >-
                Oldest first, in the order the transitions were accepted.
                Creation is not a transition, so a newly created action has an
                empty history.
              items: {$ref: '#/components/schemas/PreventiveActionHistory'}
    PreventiveActionCreate:
      type: object
      additionalProperties: false
      required: [community_code, title]
      properties:
        community_code:
          type: string
          description: Community the action belongs to; must not be blank.
        title: {type: string, description: Must not be blank.}
        description: {type: string}
        priority: {type: string}
        assignee: {type: string}
        due_date:
          type: string
          description: Calendar date (YYYY-MM-DD); a date-time is refused.
    PreventiveActionTransition:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: {$ref: '#/components/schemas/PreventiveActionState'}
        note:
          type: string
          description: Optional free-text reason, recorded in the history row.
