apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firewatch
  annotations:
    # The gateway Service is HTTPS-only: its port is named `https` and the
    # pod behind it serves TLS with the gateway-tls Secret (workloads.yaml).
    # NGINX proxies every backend in plaintext unless it is told otherwise,
    # and this is the hop it would get wrong, because the gateway's own
    # guard sits on the other side of it: plaintext into a TLS listener
    # fails each request instead of failing the rollout, so the symptom
    # would be a 502 per request rather than a deployment that will not
    # come up.
    nginx.ingress.kubernetes.io/backend-protocol: 'HTTPS'
    # Encrypted is not authenticated. `proxy-ssl-verify` defaults to `off`, so
    # without this the controller completes a TLS handshake with anything that
    # answers on the Service address and calls the hop secure because it is
    # encrypted. With it on, NGINX checks the chain and the name below and
    # fails the request when the certificate does not check out.
    nginx.ingress.kubernetes.io/proxy-ssl-verify: 'on'
    # The name NGINX matches against the certificate's subject alternative
    # names. gateway-tls carries `gateway` (bootstrap-secrets.sh, the
    # `issue_certificate gateway` line). Without this annotation the name is
    # not checked at all, so any certificate signed by the trusted CA below
    # would pass as the gateway — including one issued for another service in
    # this namespace.
    nginx.ingress.kubernetes.io/proxy-ssl-name: gateway
    # The trust anchor that verification above uses, and the only place NGINX
    # reads one from: there is no separate annotation for it, so turning
    # verification on without this line checks the gateway against NGINX's own
    # trust store, which has never heard of the internal CA, and every request
    # fails at the hop. The value must be namespace/name: a bare name fails
    # `invalid format (namespace/name)`, the controller denies the location,
    # and every request through it answers 503. The Secret carries `ca.crt`,
    # the key the controller renders as proxy_ssl_trusted_certificate;
    # bootstrap-secrets.sh writes it.
    nginx.ingress.kubernetes.io/proxy-ssl-secret: firewatch/gateway-upstream-ca
    # Edge TLS is the one boundary where traffic still arrives in clear, so
    # the redirect is what keeps http:// from being served at all. The
    # certificate is the operator-supplied `firewatch-tls` Secret named
    # below: it certifies the public DNS name, which this repository does
    # not own, and bootstrap-secrets.sh deliberately does not create it.
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: 8k
spec:
  # The class a controller installs as `nginx`. `gateway-entry` (network.yaml)
  # admits only the `ingress-nginx` namespace into the gateway pod, so a
  # controller installed under another namespace label is denied there rather
  # than quietly allowed.
  ingressClassName: nginx
  tls:
    - hosts: [firewatch.example.invalid]
      secretName: firewatch-tls
  rules:
    - host: firewatch.example.invalid
      http:
        paths:
          - path: /v1/
            pathType: Prefix
            backend:
              service:
                # Port by number: 8080 is the gateway Service port and its
                # target port is the container's `https` port. What decides
                # the scheme of this hop is the backend-protocol annotation
                # above, not the port name.
                name: gateway
                port: {number: 8080}
