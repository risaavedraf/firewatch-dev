apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: firewatch
resources:
  - namespace.yaml
  - config.yaml
  # Data plane first: the application workloads cannot become ready before these
  # exist, and a render that lists them here is the closest thing to an ordering
  # guarantee kustomize offers.
  - postgres.yaml
  - rabbitmq.yaml
  # The two bootstrap Jobs come before any replica: migrating a database that has
  # no schema only works if it runs first, and provisioning the broker before the
  # services dial it is what keeps their first reconnection from being a failure.
  # Kustomize renders a list; it guarantees no apply order. This is the intended
  # order, and enforcing it is the delivery's job (T7, T9).
  - jobs-migrate.yaml
  - broker-provision.yaml
  - workloads.yaml
  - autoscaling.yaml
  - network.yaml
  - ingress.yaml
