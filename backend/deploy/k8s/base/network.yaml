apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: dns-and-oidc}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Narrow this CIDR to the actual identity provider's egress range in an overlay.
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-entry}
spec:
  podSelector:
    matchLabels: {app: gateway}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - podSelector:
            matchExpressions: [{key: app, operator: In, values: [jobs, risk]}]
      ports: [{protocol: TCP, port: 8080}]
    # prevention listens on its own port, so it needs its own egress rule: one
    # rule carries one port, and folding it into the rule above would open the
    # wrong port.
    - to:
        - podSelector:
            matchExpressions: [{key: app, operator: In, values: [prevention]}]
      ports: [{protocol: TCP, port: 8084}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: service-entry-and-data}
spec:
  podSelector:
    matchExpressions: [{key: app, operator: In, values: [jobs, risk]}]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: gateway}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{protocol: TCP, port: 8080}]
  # The data plane runs in this namespace and carries app.kubernetes.io/name, not
  # `app`. A namespaceSelector for `firewatch-infra` named a namespace no
  # manifest creates, so this egress matched nothing at all.
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: postgres}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: rabbitmq}
      ports: [{protocol: TCP, port: 5671}]
---
# The model service. One caller, no outbound client: inference's transport
# declares only the listener's key pair, so the ingress below is the whole of
# its exposure and there is no egress rule to write for it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: risk-to-inference}
spec:
  podSelector:
    matchLabels: {app: risk}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: inference}
      ports: [{protocol: TCP, port: 8080}]
---
# The ingress half of that edge, and the reason it is a separate policy: a rule
# that only opens egress leaves the destination shut, which is the defect L6
# found in the data plane.
#
# This one is its own policy rather than a rule inside `service-entry-and-data`
# because that policy selects jobs as well as risk, and no code path of jobs
# calls the model service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: inference-entry}
spec:
  podSelector:
    matchLabels: {app: inference}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: risk}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: prevention-entry-and-data}
spec:
  podSelector:
    matchLabels: {app: prevention}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: gateway}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{protocol: TCP, port: 8084}]
  # No broker egress: this service owns one schema and talks to nothing else.
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: postgres}
      ports: [{protocol: TCP, port: 5432}]
---
# The identity provider. Four services verify a bearer token and therefore
# fetch the key set; the provider itself reads its database and calls nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: identity-entry-and-data}
spec:
  podSelector:
    matchLabels: {app: keycloak}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [gateway, jobs, risk, prevention]
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: postgres}
      ports: [{protocol: TCP, port: 5432}]
---
# The client half of that edge. One flow with exactly four sources is one policy
# instead of four copies, and Kubernetes unions every policy that selects a pod,
# so this adds a rule to each of those pods instead of replacing the ones above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: oidc-egress}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [gateway, jobs, risk, prevention]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: keycloak}
      ports: [{protocol: TCP, port: 8443}]
---
# Ingress back into the data plane. `default-deny` closes every pod in the
# namespace, and a policy that only opens egress leaves the destination shut: the
# store and the broker were reachable by nothing.
#
# A bare podSelector matches pods of this policy's own namespace, which is where
# both StatefulSets live, so the labels here are the ones those pods actually
# carry. The sources are the application Deployments by their `app` label, plus
# the migration Job, which is named here instead of borrowing an application's
# label: a Job that pretends to be `risk` would be admitted everywhere `risk`
# is, which is more than a migration needs. Keycloak is the fifth source and not
# an application: its database is the `identity` one on this same server, and it
# opens it directly instead of through an application DSN.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres-entry}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [jobs, risk, prevention, keycloak, migrate]
      ports: [{protocol: TCP, port: 5432}]
---
# The broker is reached by the two services that publish or consume; prevention
# has no broker client and therefore stays out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: rabbitmq-entry}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions: [{key: app, operator: In, values: [jobs, risk]}]
      ports: [{protocol: TCP, port: 5671}]
---
# The management listener carries operator commands over plain HTTP inside the
# cluster. Nothing admitted it before, while `rabbitmq.yaml` claimed it was
# restricted to the provisioning namespace: the truth was that the provisioning
# Job could not reach it at all. One source, one port, and no data crosses it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: rabbitmq-management}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: broker-provision}
      ports: [{protocol: TCP, port: 15671}]
---
# Both bootstrap Jobs are their own sources. They carry `app: migrate` and
# `app: broker-provision`, labels no Deployment uses, so neither inherits an
# application's egress: each one gets exactly the single destination it
# provisions. DNS already reaches every pod through `dns-and-oidc`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: migrate-egress}
spec:
  podSelector:
    matchLabels: {app: migrate}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: postgres}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: broker-provision-egress}
spec:
  podSelector:
    matchLabels: {app: broker-provision}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: rabbitmq}
      ports: [{protocol: TCP, port: 15671}]
