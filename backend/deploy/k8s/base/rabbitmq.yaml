# RabbitMQ for the Kubernetes delivery.
#
# Two listeners on purpose, and only one of them carries application traffic:
#
#   - 5671, amqps, with the internal CA's server certificate. This is the only
#     listener the services may use; the startup guards refuse `amqp://` outside
#     development, so a plaintext listener would be dead weight at best.
#   - 15672, the management API, plaintext and reachable only from the namespace
#     that runs the provisioning Job and from monitoring, enforced by
#     NetworkPolicy. It carries operator commands and no data-plane traffic.
#
# The Erlang cookie comes from the Secret: it must survive a restart, otherwise a
# restarted node refuses to rejoin its own data directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: firewatch
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: firewatch
data:
  rabbitmq.conf: |
    # No plaintext AMQP listener at all.
    listeners.tcp = none
    listeners.ssl.default = 5671
    ssl_options.cacertfile = /etc/rabbitmq/tls/ca.crt
    ssl_options.certfile = /etc/rabbitmq/tls/tls.crt
    ssl_options.keyfile = /etc/rabbitmq/tls/tls.key
    # No client certificates: service identity is the AMQP user and its
    # permissions, which BH-04 measures. verify_none here is server-side
    # acceptance of clients, not the client's verification of the server.
    ssl_options.verify = verify_none
    ssl_options.fail_if_no_peer_cert = false
    management.tcp.port = 15672
    prometheus.tcp.port = 15692
    # Quorum queues are the default here; the topology script declares them
    # explicitly, and a single node gives durability, not availability.
    default_queue_type = quorum
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: firewatch
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: firewatch
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqps
      port: 5671
      targetPort: amqps
    - name: management
      port: 15672
      targetPort: management
    - name: metrics
      port: 15692
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: firewatch
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: firewatch
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqps
      port: 5671
      targetPort: amqps
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: firewatch
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: firewatch
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: firewatch
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1.8-management
          ports:
            - name: amqps
              containerPort: 5671
            - name: management
              containerPort: 15672
            - name: metrics
              containerPort: 15692
          env:
            # The provisioning identity, used only by the topology Job through the
            # management API. The services authenticate as themselves.
            - name: RABBITMQ_DEFAULT_USER
              value: firewatch
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: broker-credentials
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_DEFAULT_VHOST
              value: firewatch
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: broker-credentials
                  key: RABBITMQ_ERLANG_COOKIE
            # The image reads this to know which plugins to enable; both are
            # needed, one for the provisioning API and one for metrics.
            - name: RABBITMQ_ENABLED_PLUGINS_FILE
              value: /etc/rabbitmq/enabled_plugins
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/conf.d
              readOnly: true
            - name: tls
              mountPath: /etc/rabbitmq/tls
              readOnly: true
            - name: plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
              readOnly: true
          # The Erlang node answers before the applications start, so `ping` alone
          # proves nothing about the broker serving AMQP. Readiness therefore asks
          # the diagnostics command that waits for the broker application itself.
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_running]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
        - name: tls
          secret:
            secretName: rabbitmq-tls
        - name: plugins
          configMap:
            name: rabbitmq-plugins
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 4Gi
