---
apiVersion: v1
kind: Service
metadata: {name: prevention}
spec:
  selector: {app: prevention}
  ports: [{name: http, port: 8084, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: gateway}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: gateway}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
