name: firewatch

x-oidc: &oidc
  APP_ENV: development
  OIDC_ISSUER: http://localhost:8081/realms/firewatch
  OIDC_JWKS_URL: http://identity:8080/realms/firewatch/protocol/openid-connect/certs
  OIDC_AUDIENCE: firewatch-api

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: '65532:65532'
  init: true
  pids_limit: 100
  mem_limit: 256m
  cpus: 1.0
  networks: [backend]
  restart: unless-stopped

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD:?required}
      RISK_DB_PASSWORD: ${RISK_DB_PASSWORD:?required}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/local/postgres-init.sh:/docker-entrypoint-initdb.d/10-firewatch.sh:ro
    networks: [backend]
    healthcheck:
      # pg_isready without -h probes the local Unix socket. The entrypoint runs
      # docker-entrypoint-initdb.d against a temporary server started with
      # listen_addresses='' that answers on that same socket, so a socket-only
      # probe can report the container healthy while the real server is not yet
      # listening on TCP and the databases do not exist. The *-migrate services
      # would then dial and exit with `migration connection failed`.
      # -h 127.0.0.1 makes the probe a real TCP connection, which succeeds only
      # once the init script has finished and the real server is listening.
      # scripts/verify_synthetic.py already treats TCP as readiness.
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1.8-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: firewatch
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?required}
      RABBITMQ_DEFAULT_VHOST: firewatch
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/local/rabbitmq-plugins:/etc/rabbitmq/enabled_plugins:ro
    ports: ['127.0.0.1:15672:15672']
    networks: [backend, edge]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Owns the broker topology and the per-service identities (BH-04). The services
  # verify their resources passively instead of declaring them: binding a queue to
  # another service's exchange requires write permission there, and holding it
  # would let one service publish as its peer. Credentials are read from the
  # environment and never printed.
  broker-topology:
    image: curlimages/curl:8.12.1
    entrypoint: [sh, /rabbitmq-topology.sh]
    environment:
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      ADMIN_USER: firewatch
      ADMIN_PASS: ${RABBITMQ_PASSWORD:?required}
      # Development convenience: the two identities derive distinct passwords from
      # the one secret this file already requires, so a fresh clone boots without
      # new variables. Production demands a secret per identity instead.
      JOBS_PASSWORD: ${RABBITMQ_PASSWORD:?required}-jobs
      RISK_PASSWORD: ${RABBITMQ_PASSWORD:?required}-risk
    volumes:
      - ./deploy/local/rabbitmq-topology.sh:/rabbitmq-topology.sh:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: 'no'


  identity:
    image: quay.io/keycloak/keycloak:26.5.7
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/identity
      KC_DB_USERNAME: identity_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: 'true'
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?required}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:?required}
      # The directory client's secret is substituted into the imported realm, so
      # the realm file carries a placeholder and never a credential. It defaults
      # to empty: the stack then starts with a directory that is not configured and
      # GET /v1/users answers 503 rather than exposing an unauthenticated read.
      DIRECTORY_CLIENT_SECRET: ${DIRECTORY_CLIENT_SECRET:-}
    volumes:
      - ./deploy/local/firewatch-realm.json:/opt/keycloak/data/import/firewatch-realm.json:ro
    ports: ['127.0.0.1:8081:8080']
    networks: [backend, edge]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  jobs-migrate:
    <<: *hardened
    build: {context: ., dockerfile: services/jobs/Dockerfile}
    command: [migrate]
    restart: 'no'
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?required}@postgres:5432/jobs?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}

  risk-migrate:
    <<: *hardened
    build: {context: ., dockerfile: services/risk/Dockerfile}
    command: [migrate]
    restart: 'no'
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?required}@postgres:5432/risk?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}

  prevention-migrate:
    <<: *hardened
    build: {context: ., dockerfile: services/prevention/Dockerfile}
    command: [migrate]
    restart: 'no'
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?required}@postgres:5432/risk?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}

  jobs:
    <<: *hardened
    build: {context: ., dockerfile: services/jobs/Dockerfile}
    environment:
      <<: *oidc
      DATABASE_URL: postgres://jobs_app:${JOBS_DB_PASSWORD:?required}@postgres:5432/jobs?sslmode=disable
      AMQP_URL: amqp://firewatch-jobs:${RABBITMQ_PASSWORD:?required}-jobs@rabbitmq:5672/firewatch
    depends_on:
      jobs-migrate: {condition: service_completed_successfully}
      broker-topology: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}

  # The model service. It publishes no host port on purpose (S3): it is
  # reachable only on the internal `backend` network, `risk` is its only caller,
  # and the gateway does not route to it. Publishing /predict would let any
  # caller generate load against the model and probe its behaviour, and no
  # client needs it - the frontend reads published batches from Postgres.
  #
  # The artifact is mounted rather than baked into the image, so the model a
  # container serves is a file in this repository and a trained artifact
  # replaces it without rebuilding anything.
  inference:
    <<: *hardened
    build: {context: ., dockerfile: services/inference/Dockerfile}
    environment:
      FIREWATCH_MODEL_PATH: /models/logistic.json
    volumes:
      - ./services/inference/testdata/logistic.json:/models/logistic.json:ro
    healthcheck:
      # The image is distroless: no shell and no HTTP client, so the probe is
      # the service's own deploy-time gate. `/server -validate` loads and
      # validates the configured artifact through the same code path startup
      # uses and exits non-zero when it would refuse to serve, which is what a
      # broken or missing mount looks like from outside. It cannot prove the
      # listener is bound; what covers that is `risk` failing the unit closed
      # instead of assuming an answer.
      test: [CMD, /server, -validate]
      interval: 5s
      timeout: 5s
      retries: 12

  risk:
    <<: *hardened
    build: {context: ., dockerfile: services/risk/Dockerfile}
    environment:
      <<: *oidc
      DATABASE_URL: postgres://risk_app:${RISK_DB_PASSWORD:?required}@postgres:5432/risk?sslmode=disable
      AMQP_URL: amqp://firewatch-risk:${RABBITMQ_PASSWORD:?required}-risk@rabbitmq:5672/firewatch
      # The classifier the service runs is chosen at startup, not by the registry's
      # `active` row. The local stack selects v2 so the demo classifies with it;
      # set MODEL_ID in .env to run another registered version instead.
      MODEL_ID: ${MODEL_ID:-firewatch-rule-v2}
      # The internal address of the model service. It is set here rather than
      # defaulted in the service, because a hardcoded default would silently
      # point a deployment somewhere nobody configured. With it set,
      # `MODEL_ID=ml-fixture-v1` exercises the whole route - risk, inference,
      # POST /predict, one stored level - without editing this file, and the
      # rule deployments that are the default never call it.
      INFERENCE_URL: http://inference:8080
      INFERENCE_TIMEOUT: ${INFERENCE_TIMEOUT:-5s}
    depends_on:
      risk-migrate: {condition: service_completed_successfully}
      broker-topology: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
      inference: {condition: service_healthy}

  prevention:
    <<: *hardened
    build: {context: ., dockerfile: services/prevention/Dockerfile}
    environment:
      <<: *oidc
      # Owns the `prevention` schema of this database, not the whole database.
      DATABASE_URL: postgres://risk_app:${RISK_DB_PASSWORD:?required}@postgres:5432/risk?sslmode=disable
      # Admin API of the identity provider, read by GET /v1/users as the
      # confidential `firewatch-directory` client the realm declares. The secret
      # defaults to empty on purpose: without it the stack still starts and the
      # route fails closed with 503 instead of answering an empty list.
      KEYCLOAK_ADMIN_URL: http://identity:8080
      KEYCLOAK_ADMIN_REALM: firewatch
      DIRECTORY_CLIENT_ID: firewatch-directory
      DIRECTORY_CLIENT_SECRET: ${DIRECTORY_CLIENT_SECRET:-}
    depends_on:
      prevention-migrate: {condition: service_completed_successfully}

  gateway:
    <<: *hardened
    build: {context: ., dockerfile: services/gateway/Dockerfile}
    environment:
      <<: *oidc
      JOBS_URL: http://jobs:8080
      RISK_URL: http://risk:8080
      PREVENTION_URL: http://prevention:8084
      WEB_ORIGIN: http://localhost:4173
    ports: ['127.0.0.1:8080:8080']
    networks: [backend, edge]
    depends_on: [jobs, risk, prevention, identity]

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    volumes:
      - ./deploy/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/local/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    networks: [backend, edge]

  # Grafana reads Prometheus over the internal network; nothing else about it is
  # configured here, because the datasource and the dashboard are files under
  # deploy/local/grafana/, so the panels are reviewed like any other artifact.
  # The admin password is required rather than defaulted: a fixed default would
  # ship a working credential nobody chose.
  grafana:
    image: grafana/grafana:11.5.2
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./deploy/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/local/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ['127.0.0.1:3000:3000']
    networks: [backend, edge]
    depends_on: [prometheus]

  jobs-test:
    profiles: [test]
    build: {context: ., dockerfile: services/jobs/Dockerfile, target: test}
    environment:
      TEST_DATABASE_URL: postgres://jobs_app:${JOBS_DB_PASSWORD:?required}@postgres:5432/jobs_test?sslmode=disable
      TEST_ZONES_REFERENCE_DATABASE_URL: postgres://risk_app:${RISK_DB_PASSWORD:?required}@postgres:5432/risk_test?sslmode=disable
    depends_on:
      jobs-test-migrate: {condition: service_completed_successfully}
      risk-test-migrate: {condition: service_completed_successfully}
    networks: [backend]

  risk-test:
    profiles: [test]
    build: {context: ., dockerfile: services/risk/Dockerfile, target: test}
    environment:
      TEST_DATABASE_URL: postgres://risk_app:${RISK_DB_PASSWORD:?required}@postgres:5432/risk_test?sslmode=disable
    depends_on:
      risk-test-migrate: {condition: service_completed_successfully}
    networks: [backend]

  prevention-test:
    profiles: [test]
    build: {context: ., dockerfile: services/prevention/Dockerfile, target: test}
    environment:
      TEST_DATABASE_URL: postgres://risk_app:${RISK_DB_PASSWORD:?required}@postgres:5432/risk_test?sslmode=disable
    depends_on:
      prevention-test-migrate: {condition: service_completed_successfully}
    networks: [backend]

  jobs-test-migrate:
    <<: *hardened
    profiles: [test]
    build: {context: ., dockerfile: services/jobs/Dockerfile}
    command: [migrate]
    restart: 'no'
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?required}@postgres:5432/jobs_test?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}

  risk-test-migrate:
    <<: *hardened
    profiles: [test]
    build: {context: ., dockerfile: services/risk/Dockerfile}
    command: [migrate]
    restart: 'no'
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?required}@postgres:5432/risk_test?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}

  prevention-test-migrate:
    <<: *hardened
    profiles: [test]
    build: {context: ., dockerfile: services/prevention/Dockerfile}
    command: [migrate]
    restart: 'no'
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?required}@postgres:5432/risk_test?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
