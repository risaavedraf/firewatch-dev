<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173c3b" />
    <title>FireWatch | Centro de monitoreo</title>
    <!-- The icon is a `data:` URI on purpose. The development server derives its
         allowlist from the `/`-prefixed references in the built entry document, so
         a separate icon file would either be unreachable or force a second,
         hand-maintained allowlist. `img-src 'self' data:` already admits it, and
         nothing is fetched from another origin. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%23173c3b'/%3E%3Ctext%20x='16'%20y='23'%20font-family='Georgia,serif'%20font-size='19'%20font-style='italic'%20fill='%23d7aa73'%20text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Centro de monitoreo FireWatch: estado del riesgo por comuna, historial de lotes, procedencia de fuentes y registro de actividad de la API FireWatch."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
